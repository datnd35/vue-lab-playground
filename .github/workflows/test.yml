name: Frontend Tests

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-test-pipeline-demo/package-lock.json

      - name: Install dependencies
        working-directory: frontend-test-pipeline-demo
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend-test-pipeline-demo
        run: npm test
